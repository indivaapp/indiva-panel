name: Purge Unexplained Feedback

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Gerçekten silmek için tam olarak "DELETE" yazın (boş = sadece sayım, güvenli)'
        required: false
        default: ''

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Purge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CONFIRM_DELETE: ${{ github.event.inputs.confirm_delete }}
        run: node scripts/purgeUnexplainedFeedback.js
