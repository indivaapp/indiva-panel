name: Auto Social AI Suggest

on:
  # DURAKLATILDI: AI tüketimi geçici olarak durduruldu.
  # Yeniden etkinleştirmek için aşağıdaki satırların başındaki # işaretini kaldır:
  # schedule:
  #   - cron: '57 9,13,17 * * *'
  workflow_dispatch:

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Social AI Suggest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/auto-social-ai-suggest.js
