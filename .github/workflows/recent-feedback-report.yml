name: Recent Feedback Report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Kaç son kayıt gösterilsin'
        required: false
        default: '30'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/recentFeedbackReport.js
