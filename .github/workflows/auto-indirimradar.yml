name: Auto IndirimRadar Deal Fetcher

on:
  # DURAKLATILDI: AI tüketimi geçici olarak durduruldu.
  # Yeniden etkinleştirmek için aşağıdaki schedule bloğunu geri ekle:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

# Aynı anda sadece bir run çalışsın; yenisi gelirse beklesin (iptal etmesin)
concurrency:
  group: auto-indirimradar-chain
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    permissions:
      actions: write  # workflow_dispatch tetiklemek için

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Cache Processed IDs
        uses: actions/cache@v4
        with:
          path: data/processed_indirimradar_ids.json
          key: indirimradar-ids-v1-${{ github.run_number }}
          restore-keys: |
            indirimradar-ids-v1-

      - name: Run Auto-IndirimRadar Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/auto-indirimradar.js

      - name: Sonraki çalışmayı planla
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "⏸️ Pipeline duraklatıldı — otomatik zincir tetiklenmedi."
          echo "Yeniden başlatmak için schedule trigger'ı ve bu adımı geri ekleyin."
